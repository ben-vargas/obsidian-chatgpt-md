name: Bug report
description: Report a reproducible ChatGPT MD problem
title: "[Bug]: "
labels: [bug, needs reproduction]
body:
  - type: markdown
    attributes:
      value: "Remove API keys and private note contents before submitting."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: ChatGPT MD, Obsidian, operating system, and device
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider and model
  - type: dropdown
    id: streaming
    attributes:
      label: Streaming mode
      options: [Enabled, Disabled, Not applicable]
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include sanitized frontmatter when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed API keys and private vault content.
          required: true
