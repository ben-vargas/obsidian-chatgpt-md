name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify tag and manifest versions
        run: |
          node -e 'const fs=require("fs"); const manifest=JSON.parse(fs.readFileSync("manifest.json")); const pkg=JSON.parse(fs.readFileSync("package.json")); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ""); if (manifest.version!==pkg.version || tag!==pkg.version) throw new Error(`Version mismatch: tag=${tag}, manifest=${manifest.version}, package=${pkg.version}`)'
      - name: Publish Obsidian plugin assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
